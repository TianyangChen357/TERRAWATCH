# Install this file as /etc/nginx/conf.d/terrawatch.conf after replacing the
# hostname.  It must be included from Nginx's http context, as conf.d files are
# on standard Debian/Ubuntu/Nginx installs.

proxy_cache_path /var/cache/nginx/terrawatch-gibs
    levels=1:2
    keys_zone=terrawatch_gibs:32m
    max_size=20g
    inactive=14d
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/terrawatch-carto
    levels=1:2
    keys_zone=terrawatch_carto:16m
    max_size=4g
    inactive=60d
    use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name terrawatch.example.com;

    root /var/www/terrawatch;
    index index.html;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Raw upstream snapshots are operational records, not a public API.
    location ^~ /data/raw/ {
        return 404;
    }

    # The sync daemon publishes files here atomically.  Its state directory and
    # Earthdata credentials are outside this directory and are never served.
    location /data/ {
        alias /var/lib/terrawatch/data/;
        add_header Cache-Control "no-store" always;
    }

    # A date is part of GIBS's tile URL, so a newly selected observation date
    # naturally uses a distinct cache entry.  Nginx only requests tiles once;
    # visitors never need direct access to GIBS.
    location /tiles/gibs/ {
        rewrite ^/tiles/gibs/(.*)$ /$1 break;
        proxy_pass https://gibs.earthdata.nasa.gov;
        proxy_set_header Host gibs.earthdata.nasa.gov;
        proxy_ssl_server_name on;
        proxy_cache terrawatch_gibs;
        proxy_cache_lock on;
        proxy_cache_valid 200 36h;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Set-Cookie;
        add_header X-TerraWatch-Cache $upstream_cache_status always;
    }

    # CARTO's label tiles change slowly, so retain them longer.  Attribution is
    # still displayed in the application and must remain visible.
    location /tiles/carto/ {
        rewrite ^/tiles/carto/(.*)$ /dark_only_labels/$1 break;
        proxy_pass https://a.basemaps.cartocdn.com;
        proxy_set_header Host a.basemaps.cartocdn.com;
        proxy_ssl_server_name on;
        proxy_cache terrawatch_carto;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_ignore_headers Set-Cookie;
        add_header X-TerraWatch-Cache $upstream_cache_status always;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
